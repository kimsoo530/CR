<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<rect width="1200" height="300" fill="#ffffff"/><text x="60" y="45" font-family="Arial" font-size="24" font-weight="bold" fill="#18232d">Myanmar strategic frameworks: verified dates and status</text>
<line x1="100" y1="150" x2="1100" y2="150" stroke="#455a64" stroke-width="4"/>
<circle cx="250" cy="150" r="12" fill="#1565c0"/><text x="180" y="115" font-family="Arial" font-size="18" font-weight="bold">Aug 2018</text><text x="120" y="190" font-family="Arial" font-size="17">MSDP 2018–2030</text><text x="120" y="216" font-family="Arial" font-size="14">national development plan</text>
<circle cx="600" cy="150" r="12" fill="#ef6c00"/><text x="530" y="115" font-family="Arial" font-size="18" font-weight="bold">31 Mar 2021</text><text x="490" y="190" font-family="Arial" font-size="17">Federal Democracy Charter</text><text x="490" y="216" font-family="Arial" font-size="14">political/interim framework</text>
<circle cx="900" cy="150" r="12" fill="#7b1fa2"/><text x="830" y="115" font-family="Arial" font-size="18" font-weight="bold">26 Aug 2021</text><text x="820" y="190" font-family="Arial" font-size="17">MERP presentation</text><text x="820" y="216" font-family="Arial" font-size="14">official announcement; full plan unresolved</text>
<text x="60" y="270" font-family="Arial" font-size="14" fill="#455a64">Sources: MMR-MSDP-2018; MMR-CRPH-FDC-2021; MMR-MOI-MERP-2021. Dates are document/publication dates.</text>
</svg>
