<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Formal territorial-administrative hierarchy in Myanmar</title>
  <desc id="desc">Reference hierarchy from Union to Region or State and Union Territory, district, township, and ward or village tract, with self-administered areas shown as a subnational branch.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17202a} .box{fill:#f4f7f8;stroke:#1f4e5f;stroke-width:2} .branch{fill:#fff8e7;stroke:#8a641c;stroke-width:2} .line{stroke:#50636b;stroke-width:3;fill:none} .note{font-size:17px;fill:#52636b} .label{font-size:22px;font-weight:700}</style>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="55" font-size="34" font-weight="700">Formal territorial-administrative hierarchy</text>
  <text x="60" y="88" class="note">Reference structure; not a current control or service-reach map</text>
  <rect class="box" x="455" y="125" width="290" height="70" rx="6"/><text class="label" x="600" y="168" text-anchor="middle">Union</text>
  <path class="line" d="M600 195 V245 M600 245 H350 M600 245 H850"/>
  <rect class="box" x="150" y="265" width="400" height="78" rx="6"/><text class="label" x="350" y="297" text-anchor="middle">Region / State</text><text x="350" y="326" text-anchor="middle" font-size="19">formal subnational government</text>
  <rect class="box" x="650" y="265" width="400" height="78" rx="6"/><text class="label" x="850" y="297" text-anchor="middle">Union Territory</text><text x="850" y="326" text-anchor="middle" font-size="19">distinct constitutional arrangement</text>
  <path class="line" d="M350 343 V405 H190 V425 M350 405 H520 V425 M850 343 V425"/>
  <rect class="branch" x="60" y="425" width="260" height="78" rx="6"/><text x="190" y="458" text-anchor="middle" font-size="23" font-weight="700">Self-administered</text><text x="190" y="486" text-anchor="middle" font-size="19">areas / bodies</text>
  <rect class="box" x="390" y="425" width="260" height="78" rx="6"/><text class="label" x="520" y="472" text-anchor="middle">District</text>
  <rect class="box" x="720" y="425" width="260" height="78" rx="6"/><text class="label" x="850" y="472" text-anchor="middle">District</text>
  <path class="line" d="M520 503 V555 M850 503 V555"/>
  <rect class="box" x="390" y="575" width="260" height="78" rx="6"/><text class="label" x="520" y="622" text-anchor="middle">Township</text>
  <rect class="box" x="720" y="575" width="260" height="78" rx="6"/><text class="label" x="850" y="622" text-anchor="middle">Township</text>
  <text x="60" y="690" class="note">Below township: ward / village tract administration. Sources: MMR-ADMIN-GAD-HISTORY; MMR-ADMIN-SUBNATIONAL-2019; MMR-ADMIN-GAD-2014.</text>
</svg>
