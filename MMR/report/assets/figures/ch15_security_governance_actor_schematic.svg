<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f8fa"/><text x="60" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#1f2937">Myanmar security and governance actors: evidence categories</text>
<text x="60" y="88" font-family="Arial" font-size="16" fill="#4b5563">Formal design, actor claims, and observed humanitarian/security conditions are kept distinct.</text>
<rect x="70" y="140" width="300" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="180" font-family="Arial" font-size="22" font-weight="700">Formal institutions</text><text x="95" y="215" font-family="Arial" font-size="17">President / Union Government</text><text x="95" y="242" font-family="Arial" font-size="17">NDSC and Defence sector</text><text x="95" y="269" font-family="Arial" font-size="17">Foreign Affairs machinery</text><text x="95" y="296" font-family="Arial" font-size="14" fill="#374151">Constitution, Arts. 201, 206-209, Sch. 1</text>
<rect x="450" y="140" width="300" height="170" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="475" y="180" font-family="Arial" font-size="22" font-weight="700">Actor positions</text><text x="475" y="215" font-family="Arial" font-size="17">SAC official arrangements</text><text x="475" y="242" font-family="Arial" font-size="17">NUG / opposition claims</text><text x="475" y="269" font-family="Arial" font-size="17">EAO or local governance claims</text><text x="475" y="296" font-family="Arial" font-size="14" fill="#374151">Claims require issuer and date labels</text>
<rect x="830" y="140" width="300" height="170" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="855" y="180" font-family="Arial" font-size="22" font-weight="700">Observed conditions</text><text x="855" y="215" font-family="Arial" font-size="17">Violence and civilian risk</text><text x="855" y="242" font-family="Arial" font-size="17">Displacement and access limits</text><text x="855" y="269" font-family="Arial" font-size="17">Service disruption</text><text x="855" y="296" font-family="Arial" font-size="14" fill="#374151">UN / OCHA evidence; not a control map</text>
<line x1="370" y1="225" x2="450" y2="225" stroke="#6b7280" stroke-width="3"/><line x1="750" y1="225" x2="830" y2="225" stroke="#6b7280" stroke-width="3"/>
<rect x="210" y="400" width="780" height="105" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="240" y="440" font-family="Arial" font-size="19" font-weight="700">Analytical rule</text><text x="240" y="472" font-family="Arial" font-size="17">Institutional design does not prove effective nationwide operation or territorial control.</text><text x="240" y="496" font-family="Arial" font-size="15" fill="#4b5563">Sources: Constitution (2008); A/HRC/46/56 (2021); OCHA HNRP (2025).</text>
</svg>
