  <rect x="570" y="102" width="476" height="150" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="592" y="136" class="panel-title">Newly licensed FDI by sector, 2025</text><rect x="592.00" y="166" width="221.48" height="30" rx="6" fill="#176b63"/><text x="592" y="224" class="small">Processing and manufac</text><text x="592" y="240" class="small">56.5% | USD 9.80 bn</text><rect x="813.48" y="166" width="83.10" height="30" rx="6" fill="#7c2f2a"/><text x="724" y="224" class="small">Real estate business</text><text x="724" y="240" class="small">21.2% | USD 3.67 bn</text><rect x="896.58" y="166" width="87.02" height="30" rx="6" fill="#b8873a"/><text x="856" y="224" class="small">Other sectors</text><text x="856" y="240" class="small">22.2% | USD 3.85 bn</text>
