  <rect width="1100" height="760" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">FDI Structure: Investors, Sectors, and Regional Concentration</text>
  <text x="54" y="68" class="subtitle">FDI is geographically concentrated, dominated by Asian investors, and still led by processing and manufacturing.</text>
