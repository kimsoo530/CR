  <rect x="54" y="492" width="476" height="128" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="528" class="panel-title">Concentration reading</text>
  <text x="76" y="566" class="value">USD 233.15 bn</text>
  <text x="236" y="566" class="small">top three cumulative localities: Ho Chi Minh City, Bac Ninh, Hanoi</text>
  <text x="76" y="596" class="value">USD 410.35 bn</text>
  <text x="236" y="596" class="small">top ten cumulative localities after the 2025 merger map</text>
  <text x="54" y="704" class="source">Sources: NSO 2025 for FDI totals and sector split; VnEconomy using NSO data for 2025 investor-country split; Vietnam.vn/Bao Dau Tu citing Foreign Investment Agency data for post-merger locality concentration.</text>
  <text x="54" y="724" class="source">Interpretation: concentration is efficient for industrial clusters, but it increases regional inequality and makes supplier-linkage policy a provincial governance problem.</text>
</svg>
