<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="Vietnam 2025 transport throughput and merchandise trade scale">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 17px Arial,sans-serif;fill:#172026}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .value{font:700 13px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="720" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Viet Nam Transport Throughput and Trade Scale, 2025</text>
  <text x="54" y="68" class="subtitle">Transport demand rose quickly in 2025 while merchandise trade exceeded USD 930 billion, making logistics reliability a macroeconomic issue.</text>
  <rect x="54" y="104" width="992" height="260" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="136" class="panel-title">Passenger and freight transport service indicators</text>
  <text x="78" y="189" class="value">Passenger carried</text>
  <rect x="252" y="174" width="626.93" height="22" rx="5" fill="#176b63"/>
  <text x="888.93" y="190" class="label">6,183.6 million passenger trips | +22.2%</text>
  <text x="78" y="239" class="value">Passenger-km</text>
  <rect x="252" y="224" width="384.06" height="22" rx="5" fill="#176b63"/>
  <text x="646.06" y="240" class="label">312.0 billion passenger-km | +13.6%</text>
  <text x="78" y="289" class="value">Freight carried</text>
  <rect x="252" y="274" width="398.18" height="22" rx="5" fill="#176b63"/>
  <text x="660.18" y="290" class="label">3,027.7 million tons | +14.1%</text>
  <text x="78" y="339" class="value">Ton-km</text>
  <rect x="252" y="324" width="369.94" height="22" rx="5" fill="#176b63"/>
  <text x="631.94" y="340" class="label">612.3 billion ton-km | +13.1%</text>
  <rect x="54" y="404" width="992" height="210" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="436" class="panel-title">Merchandise trade handled by the logistics system</text>
  <text x="78" y="489" class="value">Goods exports</text>
  <rect x="252" y="474" width="670.76" height="22" rx="5" fill="#7c2f2a"/>
  <text x="932.76" y="490" class="label">475.0 current US$ billion | +17.0%</text>
  <text x="78" y="539" class="value">Goods imports</text>
  <rect x="252" y="524" width="642.47" height="22" rx="5" fill="#7c2f2a"/>
  <text x="904.47" y="540" class="label">455.0 current US$ billion | +19.4%</text>
  <text x="78" y="589" class="value">Manufactured exports</text>
  <rect x="252" y="574" width="595.12" height="22" rx="5" fill="#7c2f2a"/>
  <text x="857.12" y="590" class="label">421.5 current US$ billion</text>
  <text x="78" y="639" class="value">Capital goods imports</text>
  <rect x="252" y="624" width="601.67" height="22" rx="5" fill="#7c2f2a"/>
  <text x="863.67" y="640" class="label">426.1 current US$ billion</text>
  <text x="54" y="674" class="source">Source: National Statistics Office of Viet Nam, Socio-economic situation in Q4 and 2025. Transport units are full-year 2025; trade values are current US$ billions.</text>
</svg>
