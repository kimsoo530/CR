  <text x="634" y="390.00" class="panel-y">-50%</text>
  <line x1="644" y1="334.57" x2="1016" y2="334.57" stroke="#edf2ef"/>
  <text x="634" y="338.57" class="panel-y">-25%</text>
  <line x1="644" y1="283.14" x2="1016" y2="283.14" stroke="#edf2ef"/>
  <text x="634" y="287.14" class="panel-y">0%</text>
  <line x1="644" y1="231.71" x2="1016" y2="231.71" stroke="#edf2ef"/>
  <text x="634" y="235.71" class="panel-y">25%</text>
  <line x1="644" y1="180.29" x2="1016" y2="180.29" stroke="#edf2ef"/>
  <text x="634" y="184.29" class="panel-y">50%</text>
  <line x1="644.00" y1="170" x2="644.00" y2="386" stroke="#f1f4f5"/>
