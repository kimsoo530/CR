  <text x="314.00" y="410" class="panel-x">2010</text>
  <line x1="472.46" y1="170" x2="472.46" y2="386" stroke="#f1f4f5"/>
  <text x="472.46" y="410" class="panel-x">2020</text>
  <line x1="520.00" y1="170" x2="520.00" y2="386" stroke="#f1f4f5"/>
  <text x="520.00" y="410" class="panel-x">2023</text>
  <path d="M108.00,357.75 L123.85,293.15 L139.69,286.35 L155.54,276.34 L171.38,270.52 L187.23,268.86 L203.08,258.89 L218.92,253.08 L234.77,210.71 L250.62,211.54 L266.46,235.63 L282.31,229.82 L298.15,210.71 L314.00,199.91 L329.85,186.62 L345.69,195.75 L361.54,190.77 L377.38,184.95 L393.23,184.12 L409.08,184.95 L424.92,178.31 L440.77,178.31 L456.62,183.29 L472.46,179.97 L488.31,178.31 L504.15,178.31 L520.00,179.97" fill="none" stroke="#176b63" stroke-width="3"/>
