  <text x="468.00" y="171.97" class="panel-last">99.8%</text>
  <rect x="76" y="402" width="10" height="10" fill="#176b63" rx="2"/>
  <text x="92" y="411" class="legend">Access</text>
  <rect x="590" y="112" width="456" height="320" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="144" class="panel-title">Energy imports, net (% of energy use)</text>
