<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-label="Vietnam electricity access and rising net energy import dependence">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 16px Arial,sans-serif;fill:#172026}
    .panel-y{font:11px Arial,sans-serif;fill:#526069;text-anchor:end}
    .panel-x{font:11px Arial,sans-serif;fill:#526069;text-anchor:middle}
    .panel-last{font:700 11px Arial,sans-serif;fill:#172026}
    .legend{font:11px Arial,sans-serif;fill:#526069}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .value{font:700 24px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="680" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Energy Access Success and Rising Import Dependence</text>
  <text x="54" y="68" class="subtitle">Viet Nam solved the household access problem, but its industrial energy system has moved from near balance to net import dependence.</text>
  <rect x="54" y="112" width="496" height="320" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="144" class="panel-title">Electricity access (% of population)</text>
