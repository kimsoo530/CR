  <text x="934.62" y="410" class="panel-x">2015</text>
  <line x1="992.75" y1="170" x2="992.75" y2="386" stroke="#f1f4f5"/>
  <text x="992.75" y="410" class="panel-x">2020</text>
  <line x1="1016.00" y1="170" x2="1016.00" y2="386" stroke="#f1f4f5"/>
  <text x="1016.00" y="410" class="panel-x">2022</text>
  <path d="M644.00,285.08 L655.62,306.01 L667.25,318.69 L678.88,312.08 L690.50,319.20 L702.12,327.43 L713.75,332.02 L725.38,333.80 L737.00,343.52 L748.62,358.79 L760.25,353.06 L771.88,356.95 L783.50,349.54 L795.12,343.31 L806.75,367.74 L818.38,368.64 L830.00,389.13 L841.62,370.18 L853.25,328.00 L864.88,336.73 L876.50,309.12 L888.12,303.06 L899.75,306.86 L911.38,299.53 L923.00,284.01 L934.62,266.17 L946.25,250.20 L957.88,244.21 L969.50,227.90 L981.12,202.49 L992.75,187.64 L1004.38,213.25 L1016.00,213.20" fill="none" stroke="#7c2f2a" stroke-width="3"/>
  <circle cx="1016.00" cy="213.20" r="4" fill="#7c2f2a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="964.00" y="205.20" class="panel-last">34%</text>
  <rect x="612" y="402" width="10" height="10" fill="#7c2f2a" rx="2"/>
  <text x="628" y="411" class="legend">Net energy imports</text>
  <line x1="644" y1="283.14" x2="1016" y2="283.14" stroke="#172026" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.45"/>
  <text x="940" y="271.14" class="label">0 = import/export balance</text>
  
  <rect x="54" y="500" width="238" height="106" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="530" class="label">Electricity access</text>
  <text x="76" y="568" class="value">99.8%</text>
  <text x="76" y="590" class="label">latest WDI point, 2023</text>
  <rect x="306" y="500" width="238" height="106" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="328" y="530" class="label">Net energy imports</text>
  <text x="328" y="568" class="value">34.0%</text>
  <text x="328" y="590" class="label">of energy use, 2022</text>
  <rect x="558" y="500" width="238" height="106" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="580" y="530" class="label">Importer transition</text>
  <text x="580" y="568" class="value">2015</text>
  <text x="580" y="590" class="label">first positive WDI value</text>
  <rect x="810" y="500" width="238" height="106" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="832" y="530" class="label">Recent peak</text>
  <text x="832" y="568" class="value">46.4%</text>
  <text x="832" y="590" class="label">net import share in 2020</text>

  <text x="54" y="650" class="source">Source: World Bank WDI table IDs EG.ELC.ACCS.ZS and EG.IMP.CONS.ZS. Positive net energy import values indicate net imports; negative values indicate net exports.</text>
</svg>
