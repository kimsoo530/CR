  <text x="98" y="348.46" class="panel-y">80%</text>
  <line x1="108" y1="302.92" x2="520" y2="302.92" stroke="#edf2ef"/>
  <text x="98" y="306.92" class="panel-y">85%</text>
  <line x1="108" y1="261.38" x2="520" y2="261.38" stroke="#edf2ef"/>
