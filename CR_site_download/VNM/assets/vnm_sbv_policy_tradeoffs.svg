  <text x="612" y="442" class="panel-title">Operating logic</text>
  <text x="612" y="478" class="box-title">Growth support</text>
  <text x="746" y="478" class="box-text">credit targets, low funding costs, priority-sector guidance</text>
  <text x="612" y="514" class="box-title">FX stability</text>
  <text x="746" y="514" class="box-text">greater flexibility plus sparse intervention when stress is disorderly</text>
  <text x="612" y="550" class="box-title">Inflation anchor</text>
  <text x="746" y="550" class="box-text">limited room for easing when rates and reserves are under pressure</text>
  <text x="612" y="586" class="box-title">Bank quality</text>
  <text x="746" y="586" class="box-text">capital buffers, NPL recognition, stress tests, resolution planning</text>
  
  <rect x="54" y="662" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="70" y="688" class="label">Policy shift</text>
  <text x="70" y="720" class="value" fill="#176b63">credit ceilings -&gt; risk tools</text>
  <text x="70" y="740" class="small">IMF recommends stronger macroprudential toolkit</text>
  
  <rect x="394" y="662" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="410" y="688" class="label">Reserve constraint</text>
  <text x="410" y="720" class="value" fill="#7c2f2a">2.2 months</text>
  <text x="410" y="740" class="small">IMF projection for 2025 import cover</text>
  
  <rect x="734" y="662" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="750" y="688" class="label">Credit target</text>
  <text x="750" y="720" class="value" fill="#345995">16% target</text>
  <text x="750" y="740" class="small">SBV projection for 2025</text>
  <text x="54" y="738" class="source">Sources: World Bank WDI table IDs PA.NUS.FCRF, FI.RES.TOTL.MO, FR.INR.LEND, FR.INR.DPST; IMF 2025 Article IV; SBV 2025 credit-target release.</text>
