  <text x="54" y="44" class="title">Viet Nam Demographic Transition: Growth and Fertility</text>
  <text x="54" y="68" class="subtitle">Population growth and fertility both fell sharply after 1990; fertility has remained below replacement level in the 2020s.</text>
