  <text x="72" y="130" class="label">Registered FDI, 2025</text>
  <text x="72" y="162" class="value">USD 38.42 bn</text>
  <text x="72" y="184" class="small">new, adjusted, and equity capital</text>
  
  <rect x="306" y="102" width="238" height="96" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="324" y="130" class="label">Disbursed FDI, 2025</text>
  <text x="324" y="162" class="value">USD 27.62 bn</text>
  <text x="324" y="184" class="small">highest in the 2021-2025 period</text>
  
