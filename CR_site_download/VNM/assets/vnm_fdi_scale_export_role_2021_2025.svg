<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-label="Vietnam FDI registered disbursed and export role 2021 to 2025">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
