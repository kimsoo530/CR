  <rect width="1100" height="800" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">FDI Scale and Export Role, 2021-2025</text>
  <text x="54" y="68" class="subtitle">Registered capital shows future pipeline; disbursed FDI shows executed projects; export shares show how deeply foreign-invested firms dominate the trade platform.</text>
  
