<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="Viet Nam 1991 to 2020 climate and weather normal">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 17px Arial,sans-serif;fill:#172026}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .small{font:11px Arial,sans-serif;fill:#65717a}
    .value{font:700 26px Arial,sans-serif;fill:#172026}
    .card-label{font:700 12px Arial,sans-serif;fill:#65717a;text-transform:uppercase}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="720" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Viet Nam Climate and Weather Normal, 1991-2020</text>
  <text x="54" y="68" class="subtitle">Observed CRU TS 4.07 data show a warm, rainfall-concentrated climate whose administrative effects vary by region.</text>
  
  <rect x="54" y="98" width="310" height="118" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="74" y="128" class="card-label">Annual mean temperature</text>
  <text x="74" y="166" class="value">24.79 deg C</text>
  <text x="74" y="194" class="label">Coolest: Jan 20.29; warmest: Jun 27.67.</text>
  
  <rect x="394" y="98" width="310" height="118" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="414" y="128" class="card-label">Annual precipitation</text>
  <text x="414" y="166" class="value">1,767 mm</text>
  <text x="414" y="194" class="label">Driest: Feb 25; wettest: Aug 263.</text>
  
  <rect x="734" y="98" width="310" height="118" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="754" y="128" class="card-label">May-Oct rainfall</text>
  <text x="754" y="166" class="value">76.0%</text>
  <text x="754" y="194" class="label">1,342 mm falls in the main wet-season window.</text>
  <rect x="54" y="246" width="746" height="400" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="76" y="278" class="panel-title">Monthly climate normal: temperature and precipitation</text><line x1="72" y1="596.00" x2="776" y2="596.00" stroke="#edf1f2"/><text x="62" y="600.00" text-anchor="end" class="small">0 mm</text><line x1="72" y1="492.67" x2="776" y2="492.67" stroke="#edf1f2"/><text x="62" y="496.67" text-anchor="end" class="small">100 mm</text><line x1="72" y1="389.33" x2="776" y2="389.33" stroke="#edf1f2"/><text x="62" y="393.33" text-anchor="end" class="small">200 mm</text><line x1="72" y1="286.00" x2="776" y2="286.00" stroke="#edf1f2"/><text x="62" y="290.00" text-anchor="end" class="small">300 mm</text><text x="788" y="548.33" class="small">20 deg C</text><text x="788" y="445.00" class="small">24 deg C</text><text x="788" y="341.67" class="small">28 deg C</text><rect x="55.00" y="555.98" width="34" height="40.02" rx="5" fill="#345995" opacity="0.78"/><text x="72.00" y="620" text-anchor="middle" class="small">Jan</text><rect x="119.00" y="570.13" width="34" height="25.87" rx="5" fill="#345995" opacity="0.78"/><text x="136.00" y="620" text-anchor="middle" class="small">Feb</text><rect x="183.00" y="550.21" width="34" height="45.79" rx="5" fill="#345995" opacity="0.78"/><text x="200.00" y="620" text-anchor="middle" class="small">Mar</text><rect x="247.00" y="517.29" width="34" height="78.71" rx="5" fill="#345995" opacity="0.78"/><text x="264.00" y="620" text-anchor="middle" class="small">Apr</text><rect x="311.00" y="429.60" width="34" height="166.40" rx="5" fill="#345995" opacity="0.78"/><text x="328.00" y="620" text-anchor="middle" class="small">May</text><rect x="375.00" y="373.29" width="34" height="222.71" rx="5" fill="#345995" opacity="0.78"/><text x="392.00" y="620" text-anchor="middle" class="small">Jun</text><rect x="439.00" y="340.27" width="34" height="255.73" rx="5" fill="#345995" opacity="0.78"/><text x="456.00" y="620" text-anchor="middle" class="small">Jul</text><rect x="503.00" y="323.95" width="34" height="272.05" rx="5" fill="#345995" opacity="0.78"/><text x="520.00" y="620" text-anchor="middle" class="small">Aug</text><rect x="567.00" y="350.22" width="34" height="245.78" rx="5" fill="#345995" opacity="0.78"/><text x="584.00" y="620" text-anchor="middle" class="small">Sep</text><rect x="631.00" y="371.74" width="34" height="224.26" rx="5" fill="#345995" opacity="0.78"/><text x="648.00" y="620" text-anchor="middle" class="small">Oct</text><rect x="695.00" y="432.83" width="34" height="163.17" rx="5" fill="#345995" opacity="0.78"/><text x="712.00" y="620" text-anchor="middle" class="small">Nov</text><rect x="759.00" y="510.54" width="34" height="85.46" rx="5" fill="#345995" opacity="0.78"/><text x="776.00" y="620" text-anchor="middle" class="small">Dec</text><path d="M 72.00 536.84 L 136.00 505.84 L 200.00 450.04 L 264.00 387.27 L 328.00 354.46 L 392.00 346.19 L 456.00 352.13 L 520.00 357.82 L 584.00 375.38 L 648.00 411.29 L 712.00 457.02 L 776.00 515.40" fill="none" stroke="#b8873a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="72.00" cy="536.84" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="136.00" cy="505.84" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="200.00" cy="450.04" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="264.00" cy="387.27" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="328.00" cy="354.46" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="392.00" cy="346.19" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="456.00" cy="352.13" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="520.00" cy="357.82" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="584.00" cy="375.38" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="648.00" cy="411.29" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="712.00" cy="457.02" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><circle cx="776.00" cy="515.40" r="4.5" fill="#b8873a" stroke="#ffffff" stroke-width="1.5"/><rect x="76" y="610" width="14" height="14" rx="3" fill="#345995" opacity="0.78"/><text x="98" y="622" class="label">Precipitation, millimeters</text><line x1="298" y1="617" x2="334" y2="617" stroke="#b8873a" stroke-width="4" stroke-linecap="round"/><text x="344" y="622" class="label">Mean temperature, degrees Celsius</text>
  
  <rect x="830" y="246" width="216" height="400" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="852" y="278" class="panel-title">Regional reading</text>
  <text x="852" y="316" class="card-label">North</text>
  <text x="852" y="338" class="label">Cooler winter signal,</text>
  <text x="852" y="358" class="label">delta flood control.</text>
  <text x="852" y="394" class="card-label">Central coast</text>
  <text x="852" y="416" class="label">Storms, narrow plains,</text>
  <text x="852" y="436" class="label">transport disruption.</text>
  <text x="852" y="472" class="card-label">Central Highlands</text>
  <text x="852" y="494" class="label">Upland rainfall, forests,</text>
  <text x="852" y="514" class="label">coffee and hydropower.</text>
  <text x="852" y="550" class="card-label">South and Mekong</text>
  <text x="852" y="572" class="label">Wet-dry season, salinity,</text>
  <text x="852" y="592" class="label">flood and delta risk.</text>
  <text x="852" y="628" class="small">National averages hide</text>
  <text x="852" y="644" class="small">large subnational variation.</text>

  <text x="54" y="680" class="source">Source: World Bank Climate Change Knowledge Portal, CRU TS 4.07 historical climatology for Viet Nam, 1991-2020; national aggregation of tas and pr.</text>
  <text x="54" y="700" class="source">Values are climate normal, not daily weather; subnational planning should use province-specific data where available.</text>
</svg>
