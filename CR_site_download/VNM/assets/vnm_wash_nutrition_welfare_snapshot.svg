<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-label="Vietnam water, sanitation, nutrition, and social protection snapshot">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 16px Arial,sans-serif;fill:#172026}
    .panel-y{font:11px Arial,sans-serif;fill:#526069;text-anchor:end}
    .panel-x{font:11px Arial,sans-serif;fill:#526069;text-anchor:middle}
    .panel-last{font:700 11px Arial,sans-serif;fill:#172026}
    .legend{font:11px Arial,sans-serif;fill:#526069}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .small{font:11px Arial,sans-serif;fill:#65717a}
    .value{font:700 22px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
    .box-title{font:700 14px Arial,sans-serif;fill:#172026}
    .box-text{font:12px Arial,sans-serif;fill:#526069}
    .bar-label{font:700 12px Arial,sans-serif;fill:#172026}
    .bar-value{font:12px Arial,sans-serif;fill:#526069}
  </style>
  <rect width="1100" height="820" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Water, Sanitation, Nutrition, and Welfare Gaps</text>
  <text x="54" y="68" class="subtitle">Average living standards have improved, but child WASH, nutrition, climate exposure, and social-assistance targeting remain local-capacity tests.</text>
  <rect x="54" y="104" width="496" height="246" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="138" class="panel-title">WASH deprivation and climate exposure</text>
  <text x="76" y="160" class="small">Million people or children affected</text>
  <text x="76" y="211" class="bar-label">Children lacking school WASH</text>
  <rect x="264" y="196" width="75.09" height="22" rx="5" fill="#7c2f2a"/>
  <text x="347.09" y="212" class="bar-value">7m children</text>
  <text x="76" y="256" class="bar-label">No hygienic latrines</text>
  <rect x="264" y="241" width="171.64" height="22" rx="5" fill="#b8873a"/>
  <text x="443.64" y="257" class="bar-value">16m people</text>
  <text x="76" y="301" class="bar-label">Open defecation</text>
  <rect x="264" y="286" width="32.18" height="22" rx="5" fill="#345995"/>
  <text x="304.18" y="302" class="bar-value">3m people</text>
  <text x="76" y="346" class="bar-label">Water-shortage exposure</text>
  <rect x="264" y="331" width="214.55" height="22" rx="5" fill="#176b63"/>
  <text x="486.55" y="347" class="bar-value">20m people</text>
  <rect x="590" y="104" width="456" height="246" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="138" class="panel-title">Nutrition: triple burden</text>
  <text x="612" y="160" class="small">Million children or percent of group</text>
  <text x="612" y="211" class="bar-label">Under-five stunting</text>
  <rect x="800" y="196" width="10.08" height="22" rx="5" fill="#7c2f2a"/>
  <text x="818.08" y="212" class="bar-value">1.8m children</text>
  <text x="612" y="256" class="bar-label">Severe wasting annually</text>
  <rect x="800" y="241" width="1.12" height="22" rx="5" fill="#b8873a"/>
  <text x="809.12" y="257" class="bar-value">200k children</text>
  <text x="612" y="301" class="bar-label">Ethnic-minority stunting</text>
  <rect x="800" y="286" width="186.48" height="22" rx="5" fill="#345995"/>
  <text x="994.48" y="302" class="bar-value">over 33%</text>
  <text x="612" y="346" class="bar-label">Overweight or obesity</text>
  <rect x="800" y="331" width="112.00" height="22" rx="5" fill="#176b63"/>
  <text x="920.00" y="347" class="bar-value">nearly 20%</text>
  <rect x="54" y="402" width="496" height="246" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="436" class="panel-title">2025 social-support spending</text>
  <text x="76" y="458" class="small">Trillion VND reported by localities</text>
  <text x="76" y="509" class="bar-label">National-devotee support</text>
  <rect x="264" y="494" width="215.83" height="22" rx="5" fill="#176b63"/>
  <text x="487.83" y="510" class="bar-value">VND 50.3trn</text>
  <text x="76" y="554" class="bar-label">Social protection beneficiaries</text>
  <rect x="264" y="539" width="146.75" height="22" rx="5" fill="#345995"/>
  <text x="418.75" y="555" class="bar-value">VND 34.2trn</text>
  <text x="76" y="599" class="bar-label">Poor and near-poor support</text>
  <rect x="264" y="584" width="20.17" height="22" rx="5" fill="#b8873a"/>
  <text x="292.17" y="600" class="bar-value">VND 4.7trn</text>
  <text x="76" y="644" class="bar-label">Sudden local support</text>
  <rect x="264" y="629" width="13.73" height="22" rx="5" fill="#7c2f2a"/>
  <text x="285.73" y="645" class="bar-value">VND 3.2trn</text>
  <rect x="590" y="402" width="456" height="246" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="436" class="panel-title">2025 welfare snapshot</text>
  <text x="612" y="476" class="value">1.3%</text>
  <text x="746" y="476" class="small">multidimensional poverty rate</text>
  <text x="612" y="518" class="value">5.9m VND</text>
  <text x="802" y="518" class="small">monthly per-capita household income</text>
  <text x="612" y="560" class="value">29.3m</text>
  <text x="802" y="560" class="small">insurance/free-care cards or books</text>
  <text x="612" y="604" class="box-text">The policy issue is not only poverty reduction. It is whether benefits, WASH infrastructure, nutrition services, and emergency support reach hard-to-serve places before shocks become human-capital losses.</text>
  <text x="54" y="716" class="box-title">Policy meaning</text>
  <text x="54" y="742" class="box-text">WASH, nutrition, and welfare should be read together: poor sanitation affects illness and school attendance; malnutrition affects learning and later productivity; climate shocks push households back toward vulnerability.</text>
  <text x="54" y="788" class="source">Sources: UNICEF Viet Nam WASH and Nutrition programme profiles; UNICEF 2025 impact report; NSO Viet Nam 2025 social-security and household-living indicators.</text>
</svg>
