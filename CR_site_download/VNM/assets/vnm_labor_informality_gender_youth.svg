  <text x="54" y="44" class="title">Women, Youth, Informality, and the Social-Protection Gap</text>
  <text x="54" y="68" class="subtitle">The headline labor market is stable, but exclusion appears through informal jobs, youth transition, care burdens, and limited social insurance coverage.</text>
