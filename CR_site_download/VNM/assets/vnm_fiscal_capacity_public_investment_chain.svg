  <text x="54" y="44" class="title">Fiscal Capacity and Public Investment Control Chain</text>
  <text x="54" y="68" class="subtitle">Vietnam's fiscal risk is not only debt size; it is whether revenue, budgeting, procurement, execution, and audit create public value.</text>
