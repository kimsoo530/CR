  <text x="612" y="386" class="panel-title">Governance reading</text>
  <text x="612" y="420" class="label">Fiscal discipline is strongest when four controls work together:</text>
  <text x="632" y="448" class="label">1. credible medium-term public investment planning</text>
  <text x="632" y="472" class="label">2. transparent bidding and contract management</text>
  <text x="632" y="496" class="label">3. timely disbursement without land or permit blockage</text>
  <text x="632" y="520" class="label">4. audit follow-up that fixes systems, not only sanctions individuals</text>
  <rect x="96" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="156" y="572" class="stage">Plan</text><text x="156" y="592" class="label" text-anchor="middle">Public investment law</text><line x1="220" y1="577" x2="250" y2="577" stroke="#7c2f2a" stroke-width="2.5"/><path d="M250,577 l-7,-5 v10 z" fill="#7c2f2a"/><rect x="256" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="316" y="572" class="stage">Appraise</text><text x="316" y="592" class="label" text-anchor="middle">Feasibility and priority</text><line x1="380" y1="577" x2="410" y2="577" stroke="#7c2f2a" stroke-width="2.5"/><path d="M410,577 l-7,-5 v10 z" fill="#7c2f2a"/><rect x="416" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="476" y="572" class="stage">Budget</text><text x="476" y="592" class="label" text-anchor="middle">State budget ceiling</text><line x1="540" y1="577" x2="570" y2="577" stroke="#7c2f2a" stroke-width="2.5"/><path d="M570,577 l-7,-5 v10 z" fill="#7c2f2a"/><rect x="576" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="636" y="572" class="stage">Procure</text><text x="636" y="592" class="label" text-anchor="middle">Bidding and e-procurement</text><line x1="700" y1="577" x2="730" y2="577" stroke="#7c2f2a" stroke-width="2.5"/><path d="M730,577 l-7,-5 v10 z" fill="#7c2f2a"/><rect x="736" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="796" y="572" class="stage">Execute</text><text x="796" y="592" class="label" text-anchor="middle">Land, contract, payment</text><line x1="860" y1="577" x2="890" y2="577" stroke="#7c2f2a" stroke-width="2.5"/><path d="M890,577 l-7,-5 v10 z" fill="#7c2f2a"/><rect x="896" y="548" width="120" height="58" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="956" y="572" class="stage">Audit</text><text x="956" y="592" class="label" text-anchor="middle">State Audit and inspection</text>
  
