<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="Vietnam growth driver empirical model results">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 17px Arial,sans-serif;fill:#172026}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .small{font:11px Arial,sans-serif;fill:#65717a}
    .value{font:700 22px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="720" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Empirical Signals Behind Viet Nam's Growth Drivers</text>
  <text x="54" y="68" class="subtitle">The regression identifies acceleration signals; growth accounting shows that labor-force contribution is shrinking while output-per-worker growth carries more of the model.</text>
  <rect x="54" y="104" width="992" height="304" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="76" y="138" class="panel-title">First-difference OLS: standardized coefficient signs</text><text x="76" y="162" class="label">Sample 1997-2023; n=27; R2=0.209; adjusted R2=-0.028. The model is diagnostic, not causal proof.</text><line x1="550" y1="186" x2="550" y2="374" stroke="#9aa6ad" stroke-dasharray="4 5"/><text x="230" y="390" class="small" text-anchor="middle">negative</text><text x="870" y="390" class="small" text-anchor="middle">positive</text><text x="76" y="216" class="label">Population growth change</text><rect x="262.75" y="202" width="287.25" height="18" rx="5" fill="#7c2f2a"/><text x="254.75" y="216" class="small" text-anchor="end">-0.67</text><text x="76" y="245" class="label">FDI inflow change</text><rect x="550.00" y="231" width="219.12" height="18" rx="5" fill="#176b63"/><text x="777.12" y="245" class="small" text-anchor="start">+0.51</text><text x="76" y="274" class="label">Trade openness change</text><rect x="550.00" y="260" width="155.31" height="18" rx="5" fill="#176b63"/><text x="713.31" y="274" class="small" text-anchor="start">+0.36</text><text x="76" y="303" class="label">HDI change</text><rect x="550.00" y="289" width="106.37" height="18" rx="5" fill="#176b63"/><text x="664.37" y="303" class="small" text-anchor="start">+0.25</text><text x="76" y="332" class="label">Inflation change</text><rect x="487.93" y="318" width="62.07" height="18" rx="5" fill="#7c2f2a"/><text x="479.93" y="332" class="small" text-anchor="end">-0.15</text><text x="76" y="361" class="label">Investment change</text><rect x="522.17" y="347" width="27.83" height="18" rx="5" fill="#7c2f2a"/><text x="514.17" y="361" class="small" text-anchor="end">-0.07</text>
  <rect x="54" y="446" width="992" height="202" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="76" y="480" class="panel-title">Growth accounting proxy: labor-force growth plus output per worker</text><text x="76" y="525" class="label">1991-2000</text><rect x="238" y="510" width="145.82" height="20" rx="5" fill="#b8873a"/><rect x="383.82" y="510" width="365.38" height="20" rx="5" fill="#176b63"/><text x="759.20" y="525" class="small">7.3% GDP; labor 2.1%, output/worker 5.2%</text><text x="76" y="558" class="label">2001-2010</text><rect x="238" y="543" width="181.92" height="20" rx="5" fill="#b8873a"/><rect x="419.92" y="543" width="265.89" height="20" rx="5" fill="#176b63"/><text x="695.81" y="558" class="small">6.4% GDP; labor 2.6%, output/worker 3.8%</text><text x="76" y="591" class="label">2011-2019</text><rect x="238" y="576" width="85.94" height="20" rx="5" fill="#b8873a"/><rect x="323.94" y="576" width="360.84" height="20" rx="5" fill="#176b63"/><text x="694.78" y="591" class="small">6.4% GDP; labor 1.2%, output/worker 5.2%</text><text x="76" y="624" class="label">2020-2024</text><rect x="238" y="609" width="12.99" height="20" rx="5" fill="#b8873a"/><rect x="250.99" y="609" width="341.65" height="20" rx="5" fill="#176b63"/><text x="602.64" y="624" class="small">5.1% GDP; labor 0.2%, output/worker 4.9%</text><rect x="76" y="624" width="14" height="14" rx="3" fill="#b8873a"/><text x="98" y="636" class="small">Labor-force growth</text><rect x="246" y="624" width="14" height="14" rx="3" fill="#176b63"/><text x="268" y="636" class="small">Output per labor-force worker growth</text>
  <text x="54" y="692" class="source">Sources: World Bank WDI API and UNDP Human Development Report 2025 HDI series accessed through Our World in Data. Calculations are in VNM/processed growth-driver CSV files.</text>
</svg>
