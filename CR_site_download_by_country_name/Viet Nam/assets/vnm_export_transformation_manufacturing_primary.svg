  <rect width="1100" height="760" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Export Transformation: Manufacturing Up, Primary Commodities Down</text>
  <text x="54" y="68" class="subtitle">Viet Nam shifted from food, fuel, and raw-material exports toward manufacturing and high-technology export segments.</text>
  <rect x="54" y="98" width="992" height="104" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="82" y="134" class="value">1997: manufacturing 44.0%, primary commodities 51.8%</text>
  <text x="82" y="166" class="label">By 2023: manufacturing 85.0%, primary commodities 13.3%, high-technology exports 44.3% of manufactured exports.</text>
