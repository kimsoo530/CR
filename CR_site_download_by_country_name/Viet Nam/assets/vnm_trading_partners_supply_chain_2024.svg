<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-label="Vietnam major trading partners and triangular supply chain model">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 17px Arial,sans-serif;fill:#172026}
    .panel-y{font:11px Arial,sans-serif;fill:#526069;text-anchor:end}
    .panel-x{font:11px Arial,sans-serif;fill:#526069;text-anchor:middle}
    .panel-last{font:700 11px Arial,sans-serif;fill:#172026}
    .legend{font:11px Arial,sans-serif;fill:#526069}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .small{font:11px Arial,sans-serif;fill:#65717a}
    .value{font:700 22px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="760" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Trading Partners and the Triangular Supply Chain Model</text>
  <text x="54" y="68" class="subtitle">Viet Nam sells heavily to high-income final markets while importing many components, machinery, and industrial inputs from Asian production networks.</text>
  <rect x="54" y="106" width="992" height="322" rx="10" fill="#ffffff" stroke="#d7dee2"/><text x="76" y="138" class="panel-title">Major trading partners, 2024</text><text x="344" y="164" class="small" text-anchor="middle">Exports from Viet Nam</text><text x="718" y="164" class="small" text-anchor="middle">Imports into Viet Nam</text><text x="76" y="203" class="label">United States</text><rect x="220" y="188" width="247.17" height="20" rx="5" fill="#176b63"/><text x="475.17" y="203" class="small">119.6 bn | 29.5%</text><rect x="594" y="188" width="31.00" height="20" rx="5" fill="#7c2f2a"/><text x="633.00" y="203" class="small">15.0 bn | 3.9%</text><text x="982" y="203" text-anchor="end" class="small">balance +104.6</text><text x="76" y="239" class="label">China</text><rect x="220" y="224" width="125.24" height="20" rx="5" fill="#176b63"/><text x="353.24" y="239" class="small">60.6 bn | 14.9%</text><rect x="594" y="224" width="298.22" height="20" rx="5" fill="#7c2f2a"/><text x="900.22" y="239" class="small">144.3 bn | 37.9%</text><text x="982" y="239" text-anchor="end" class="small">balance -83.7</text><text x="76" y="275" class="label">European Union</text><rect x="220" y="260" width="107.67" height="20" rx="5" fill="#176b63"/><text x="335.67" y="275" class="small">52.1 bn | 12.8%</text><rect x="594" y="260" width="34.51" height="20" rx="5" fill="#7c2f2a"/><text x="636.51" y="275" class="small">16.7 bn | 4.4%</text><text x="982" y="275" text-anchor="end" class="small">balance +35.4</text><text x="76" y="311" class="label">ASEAN</text><rect x="220" y="296" width="76.47" height="20" rx="5" fill="#176b63"/><text x="304.47" y="311" class="small">37.0 bn | 9.1%</text><rect x="594" y="296" width="96.93" height="20" rx="5" fill="#7c2f2a"/><text x="698.93" y="311" class="small">46.9 bn | 12.3%</text><text x="982" y="311" text-anchor="end" class="small">balance -9.9</text><text x="76" y="347" class="label">South Korea</text><rect x="220" y="332" width="52.70" height="20" rx="5" fill="#176b63"/><text x="280.70" y="347" class="small">25.5 bn | 6.3%</text><rect x="594" y="332" width="116.15" height="20" rx="5" fill="#7c2f2a"/><text x="718.15" y="347" class="small">56.2 bn | 14.8%</text><text x="982" y="347" text-anchor="end" class="small">balance -30.7</text><text x="76" y="383" class="label">Japan</text><rect x="220" y="368" width="50.84" height="20" rx="5" fill="#176b63"/><text x="278.84" y="383" class="small">24.6 bn | 6.1%</text><rect x="594" y="368" width="44.23" height="20" rx="5" fill="#7c2f2a"/><text x="646.23" y="383" class="small">21.4 bn | 5.6%</text><text x="982" y="383" text-anchor="end" class="small">balance +3.2</text>
  <rect x="54" y="466" width="992" height="202" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <defs><marker id="arrow-trade" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b8873a"/></marker></defs>
  <rect x="82" y="522" width="258" height="82" rx="10" fill="#edf2ef" stroke="#d7dee2"/>
  <text x="211" y="552" text-anchor="middle" class="panel-title">Asian input hubs</text>
  <text x="211" y="578" text-anchor="middle" class="small">China, Korea, Japan, ASEAN</text>
  <rect x="421" y="506" width="258" height="114" rx="10" fill="#ffffff" stroke="#172026" stroke-width="2"/>
  <text x="550" y="542" text-anchor="middle" class="panel-title">Viet Nam platform</text>
  <text x="550" y="568" text-anchor="middle" class="small">FDI-led manufacturing, assembly,</text>
  <text x="550" y="588" text-anchor="middle" class="small">industrial zones, logistics</text>
  <rect x="760" y="522" width="258" height="82" rx="10" fill="#f8f0df" stroke="#d7dee2"/>
  <text x="889" y="552" text-anchor="middle" class="panel-title">Final demand markets</text>
  <text x="889" y="578" text-anchor="middle" class="small">United States, EU, Japan, others</text>
  <path d="M340 563 L421 563" stroke="#b8873a" stroke-width="3" marker-end="url(#arrow-trade)"/>
  <path d="M679 563 L760 563" stroke="#b8873a" stroke-width="3" marker-end="url(#arrow-trade)"/>
  <text x="380" y="548" text-anchor="middle" class="small">inputs</text>
  <text x="720" y="548" text-anchor="middle" class="small">exports</text>
  <text x="82" y="648" class="label">Reading: the model creates export scale, but domestic value capture depends on whether Vietnamese firms enter higher-value supplier networks.</text>
  <text x="54" y="724" class="source">Source: Viet Nam Government Portal / General Department of Customs, 2024 partner trade flows. Units are current US$ billions; shares are calculated against total exports/imports in the same source.</text>
</svg>
