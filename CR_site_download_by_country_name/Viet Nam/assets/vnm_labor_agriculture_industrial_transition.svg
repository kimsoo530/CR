  <text x="410" y="744" class="small">of GDP, WDI</text>
  
  <rect x="734" y="666" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="750" y="692" class="label">2025 social housing target</text>
  <text x="750" y="724" class="value" fill="#345995">100,000 units</text>
  <text x="750" y="744" class="small">low-income and industrial-park workers</text>
  <text x="54" y="748" class="source">Sources: World Bank WDI/ILO modeled indicators SL.AGR.EMPL.ZS, NV.AGR.TOTL.ZS, SL.EMP.VULN.ZS, SL.EMP.WORK.ZS; VietnamPlus/VNA 2025 social-housing policy reporting.</text>
