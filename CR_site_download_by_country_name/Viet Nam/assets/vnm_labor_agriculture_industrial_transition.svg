  <rect x="54" y="462" width="476" height="174" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="496" class="panel-title">Rural transformation agenda</text>
  <text x="76" y="530" class="box-text">Land consolidation, mechanization, irrigation, agro-processing, rural logistics, and climate adaptation.</text>
  <text x="76" y="560" class="box-text">Without nonfarm jobs and skills, agricultural workers move into informal services or unstable urban work.</text>
  <text x="76" y="590" class="box-text">The Mekong Delta adds a climate-migration dimension to labor administration.</text>
  <rect x="570" y="462" width="476" height="174" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="592" y="496" class="panel-title">Industrial-zone labor agenda</text>
  <text x="592" y="530" class="box-text">Industrial parks absorb rural migrants but create demand for housing, childcare, schools, transport, safety, and dispute resolution.</text>
  <text x="592" y="560" class="box-text">Social housing targets include 100,000 new units in 2025 and at least 1 million units by 2030.</text>
  <text x="592" y="590" class="box-text">The test is whether FDI labor demand becomes stable urban livelihoods.</text>
  
  <rect x="54" y="666" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="70" y="692" class="label">2025 agriculture employment</text>
  <text x="70" y="724" class="value" fill="#b8873a">25.0%</text>
  <text x="70" y="744" class="small">of total employment, WDI/ILO modeled</text>
  
  <rect x="394" y="666" width="314" height="92" rx="10" fill="#ffffff" stroke="#d7dee2"/>
