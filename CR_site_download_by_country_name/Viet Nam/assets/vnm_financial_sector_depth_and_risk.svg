  <text x="612" y="416" class="panel-title">Risk reading</text>
  <text x="612" y="452" class="box-text">Bank credit is the main funding channel, while capital markets remain less mature.</text>
  <text x="612" y="480" class="box-text">Real estate and corporate bonds transmit borrower stress into bank balance sheets.</text>
  <text x="612" y="508" class="box-text">Public banks stabilize credit but need capital consistent with their systemic role.</text>
  <text x="612" y="536" class="box-text">The reform priority is credit quality rather than faster credit growth.</text>
  <text x="612" y="564" class="box-text">Macroprudential tools should gradually replace blunt aggregate credit ceilings.</text>
  
  
