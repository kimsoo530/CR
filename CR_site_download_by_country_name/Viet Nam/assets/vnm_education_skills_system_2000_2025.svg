  <text x="190.40" y="330" class="panel-x">2005</text>
  <line x1="272.80" y1="162" x2="272.80" y2="306" stroke="#f1f4f5"/>
  <text x="272.80" y="330" class="panel-x">2010</text>
  <line x1="355.20" y1="162" x2="355.20" y2="306" stroke="#f1f4f5"/>
  <text x="355.20" y="330" class="panel-x">2015</text>
  <line x1="437.60" y1="162" x2="437.60" y2="306" stroke="#f1f4f5"/>
  <text x="437.60" y="330" class="panel-x">2020</text>
  <line x1="520.00" y1="162" x2="520.00" y2="306" stroke="#f1f4f5"/>
  <text x="520.00" y="330" class="panel-x">2025</text>
  <path d="M355.20,188.90 L371.68,187.97 L388.16,186.78 L404.64,184.47 L421.12,182.09 L437.60,184.00 L454.08,184.56 L470.56,183.71" fill="none" stroke="#176b63" stroke-width="3"/>
  <circle cx="470.56" cy="183.71" r="4" fill="#176b63" stroke="#ffffff" stroke-width="1.5"/>
  <text x="468.00" y="175.71" class="panel-last">93.4%</text>
  <rect x="76" y="322" width="10" height="10" fill="#176b63" rx="2"/>
  <text x="92" y="331" class="legend">Secondary</text>
  <path d="M108.00,293.89 L124.48,293.82 L140.96,293.49 L157.44,293.02 L190.40,285.22 L206.88,284.00 L223.36,281.19 L239.84,279.75 L256.32,277.85 L272.80,274.68 L289.28,272.14 L305.76,272.29 L322.24,272.45 L338.72,264.99 L355.20,267.09 L371.68,267.93 L388.16,272.03 L421.12,266.43 L454.08,251.08 L470.56,247.41 L487.04,263.01 L503.52,256.79" fill="none" stroke="#345995" stroke-width="3"/>
  <circle cx="503.52" cy="256.79" r="4" fill="#345995" stroke="#ffffff" stroke-width="1.5"/>
  <text x="468.00" y="248.79" class="panel-last">37.6%</text>
  <rect x="222" y="322" width="10" height="10" fill="#345995" rx="2"/>
  <text x="238" y="331" class="legend">Tertiary</text>
  <rect x="590" y="104" width="456" height="248" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="136" class="panel-title">Government education expenditure</text>
  <line x1="644" y1="306.00" x2="1016" y2="306.00" stroke="#edf2ef"/>
  <text x="634" y="310.00" class="panel-y">0% of GDP</text>
  <line x1="644" y1="258.00" x2="1016" y2="258.00" stroke="#edf2ef"/>
  <text x="634" y="262.00" class="panel-y">2% of GDP</text>
