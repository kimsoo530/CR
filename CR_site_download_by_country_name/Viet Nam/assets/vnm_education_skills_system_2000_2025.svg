  </style>
  <rect width="1100" height="800" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Education, Skills, and Industrial-Upgrading Bottlenecks</text>
  <text x="54" y="68" class="subtitle">Vietnam's school access is strong, but tertiary quality, TVET pathways, STEM depth, and employer linkage now shape productivity.</text>
  <rect x="54" y="104" width="496" height="248" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="136" class="panel-title">Secondary and tertiary gross enrollment</text>
