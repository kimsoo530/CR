  <text x="98" y="310.00" class="panel-y">0%</text>
  <line x1="108" y1="273.27" x2="520" y2="273.27" stroke="#edf2ef"/>
  <text x="98" y="277.27" class="panel-y">25%</text>
  <line x1="108" y1="240.55" x2="520" y2="240.55" stroke="#edf2ef"/>
  <text x="98" y="244.55" class="panel-y">50%</text>
  <line x1="108" y1="207.82" x2="520" y2="207.82" stroke="#edf2ef"/>
  <text x="98" y="211.82" class="panel-y">75%</text>
  <line x1="108" y1="175.09" x2="520" y2="175.09" stroke="#edf2ef"/>
  <text x="98" y="179.09" class="panel-y">100%</text>
  <line x1="108.00" y1="162" x2="108.00" y2="306" stroke="#f1f4f5"/>
  <text x="108.00" y="330" class="panel-x">2000</text>
