  <text x="867.20" y="330" class="panel-x">2015</text>
  <line x1="941.60" y1="162" x2="941.60" y2="306" stroke="#f1f4f5"/>
  <text x="941.60" y="330" class="panel-x">2020</text>
  <line x1="1016.00" y1="162" x2="1016.00" y2="306" stroke="#f1f4f5"/>
  <text x="1016.00" y="330" class="panel-x">2025</text>
  <path d="M763.04,188.72 L777.92,190.40 L792.80,208.90 L807.68,215.27 L822.56,200.20 L837.44,197.32 L852.32,221.04 L867.20,224.00 L882.08,222.74 L896.96,223.95 L911.84,226.91 L926.72,231.96 L941.60,228.80 L956.48,235.32 L971.36,236.70" fill="none" stroke="#7c2f2a" stroke-width="3"/>
  <circle cx="971.36" cy="236.70" r="4" fill="#7c2f2a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="964.00" y="228.70" class="panel-last">2.9% of GDP</text>
  <rect x="612" y="322" width="10" height="10" fill="#7c2f2a" rx="2"/>
  <text x="628" y="331" class="legend">Education spending</text>
  
  <rect x="54" y="386" width="314" height="90" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="70" y="411" class="label">2025-2026 system scale</text>
  <text x="70" y="444" class="value" fill="#176b63">26m students</text>
  <text x="70" y="464" class="small">and about 1.6m teachers</text>
  
  <rect x="394" y="386" width="314" height="90" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="410" y="411" class="label">High-school completion</text>
  <text x="410" y="444" class="value" fill="#345995">99.25%</text>
  <text x="410" y="464" class="small">2025 graduation rate</text>
  
  <rect x="734" y="386" width="314" height="90" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="750" y="411" class="label">High-tech human resources</text>
  <text x="750" y="444" class="value" fill="#7c2f2a">2025-2035</text>
  <text x="750" y="464" class="small">new STEM and high-tech training push</text>
  <rect x="54" y="516" width="496" height="210" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="550" class="panel-title">Skills pipeline pressure</text>
  <text x="76" y="572" class="small">Selected 2025 indicators and OECD diagnostics</text>
  <text x="76" y="623" class="bar-label">Trained workers</text>
  <rect x="264" y="608" width="196.89" height="22" rx="5" fill="#176b63"/>
  <text x="468.89" y="624" class="bar-value">29.2%</text>
  <text x="76" y="668" class="bar-label">TVET participation</text>
  <rect x="264" y="653" width="40.46" height="22" rx="5" fill="#b8873a"/>
  <text x="312.46" y="669" class="bar-value">6.0%</text>
  <text x="76" y="713" class="bar-label">University completion</text>
  <rect x="264" y="698" width="67.43" height="22" rx="5" fill="#345995"/>
  <text x="339.43" y="714" class="bar-value">10.0%</text>
  <text x="76" y="758" class="bar-label">Vocational completion</text>
  <rect x="264" y="743" width="20.23" height="22" rx="5" fill="#7c2f2a"/>
  <text x="292.23" y="759" class="bar-value">3.0%</text>
  <rect x="590" y="516" width="456" height="210" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="550" class="panel-title">Administrative reading</text>
  <text x="612" y="584" class="box-text">The problem is no longer access alone. It is the alignment of schools, TVET, universities, firms, industrial parks, and provincial planning.</text>
  <text x="612" y="622" class="box-text">MOET's 2025 high-tech human-resource agenda asks universities to refresh STEM curricula for digital technology, AI, biotechnology, and practical capability.</text>
  <text x="612" y="660" class="box-text">The bottleneck is implementation: employer participation, lab capacity, faculty quality, scholarships, and pathways for rural and minority students.</text>
  <text x="54" y="768" class="source">Sources: World Bank WDI table IDs SE.SEC.ENRR, SE.TER.ENRR, SE.XPD.TOTL.GD.ZS; NSO Viet Nam 2025; OECD Economic Surveys: Viet Nam 2025; MOET 2025; UNICEF Viet Nam 2025 impact report.</text>
</svg>
