<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-label="Vietnam aviation passenger demand, air cargo, and maritime logistics scale">
  
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#172026}
    .subtitle{font:15px Arial,sans-serif;fill:#526069}
    .panel-title{font:700 17px Arial,sans-serif;fill:#172026}
    .label{font:12px Arial,sans-serif;fill:#526069}
    .value{font:700 13px Arial,sans-serif;fill:#172026}
    .source{font:12px Arial,sans-serif;fill:#65717a}
  </style>
  <rect width="1100" height="820" fill="#f6f4ee"/>
  <text x="54" y="44" class="title">Aviation and Maritime Logistics Scale</text>
  <text x="54" y="68" class="subtitle">Air transport shows service and high-value cargo demand; maritime logistics carries the bulk of Viet Nam's trade platform.</text>
  <rect x="54" y="104" width="238" height="108" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="134" class="label">Air passengers, 2025</text>
  <text x="76" y="170" style="font:700 26px Arial,sans-serif;fill:#7c2f2a">83.5m</text>
  <text x="76" y="194" class="label">+10.7% year-on-year</text>
  <rect x="306" y="104" width="238" height="108" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="328" y="134" class="label">Air cargo, 2025</text>
  <text x="328" y="170" style="font:700 26px Arial,sans-serif;fill:#176b63">1.5m tons</text>
  <text x="328" y="194" class="label">+18.5% year-on-year</text>
  <rect x="558" y="104" width="238" height="108" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="580" y="134" class="label">Seaport cargo, 2024</text>
  <text x="580" y="170" style="font:700 26px Arial,sans-serif;fill:#345995">864.4m tons</text>
  <text x="580" y="194" class="label">2025 throughput reported +10%</text>
  <rect x="810" y="104" width="238" height="108" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="832" y="134" class="label">Container throughput, 2024</text>
  <text x="832" y="170" style="font:700 26px Arial,sans-serif;fill:#b8873a">29.9m TEU</text>
  <text x="832" y="194" class="label">+21.0% year-on-year</text>
  <rect x="54" y="250" width="496" height="250" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  
  <text x="80" y="292" class="panel-title">Aviation passenger demand</text>
  <rect x="80" y="314" width="217.65" height="30" rx="6" fill="#7c2f2a"/>
  <rect x="297.65" y="314" width="172.35" height="30" rx="6" fill="#b8873a"/>
  <text x="80" y="366" class="label">International 46.6; Domestic 36.9 million passengers</text>
  <text x="80" y="388" class="value">Total 83.5 million passengers</text>
  
  <text x="80" y="414" class="panel-title">Air cargo transport</text>
  <rect x="80" y="436" width="332.07" height="30" rx="6" fill="#176b63"/>
  <rect x="412.07" y="436" width="57.93" height="30" rx="6" fill="#345995"/>
  <text x="80" y="488" class="label">International 1.3; Domestic 0.2 million tons</text>
  <text x="80" y="510" class="value">Total 1.5 million tons</text>
  <rect x="590" y="250" width="456" height="250" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="284" class="panel-title">Maritime logistics scale</text>
  
  <text x="612" y="316" class="label">Seaport cargo throughput</text>
  <rect x="612" y="324" width="259.32" height="22" rx="5" fill="#345995"/>
  <text x="881.32" y="340" class="value">864.4 m tons</text>
  
  <text x="612" y="378" class="label">Container throughput</text>
  <rect x="612" y="386" width="256.29" height="22" rx="5" fill="#b8873a"/>
  <text x="878.29" y="402" class="value">29.9 m TEU</text>
  
  <text x="612" y="440" class="label">Seagoing vessel calls, 2025</text>
  <rect x="612" y="448" width="269.20" height="22" rx="5" fill="#176b63"/>
  <text x="891.20" y="464" class="value">134.6 k calls</text>
  <rect x="54" y="540" width="496" height="176" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="76" y="574" class="panel-title">Latest aviation momentum</text>
  <text x="76" y="612" style="font:700 24px Arial,sans-serif;fill:#7c2f2a">24.19m</text>
  <text x="190" y="612" class="label">passengers in Q1 2026, +16.4% year-on-year</text>
  <text x="76" y="654" style="font:700 24px Arial,sans-serif;fill:#176b63">392.5k tons</text>
  <text x="224" y="654" class="label">air cargo in Q1 2026, +19.2% year-on-year</text>
  <text x="76" y="692" class="label">Interpretation: airports are no longer only tourism infrastructure; they support high-value, time-sensitive logistics.</text>
  <rect x="590" y="540" width="456" height="176" rx="10" fill="#ffffff" stroke="#d7dee2"/>
  <text x="612" y="574" class="panel-title">Container-port concentration, 2024</text>
  
  <text x="612" y="604" class="label">Ho Chi Minh City</text>
  <rect x="612" y="612" width="236.60" height="22" rx="5" fill="#7c2f2a"/>
  <text x="858.60" y="628" class="value">9.1 m TEU</text>
  
  <text x="612" y="650" class="label">Hai Phong</text>
  <rect x="612" y="658" width="184.60" height="22" rx="5" fill="#345995"/>
  <text x="806.60" y="674" class="value">7.1 m TEU</text>
  
  <text x="612" y="696" class="label">Cai Mep</text>
  <rect x="612" y="704" width="182.00" height="22" rx="5" fill="#176b63"/>
  <text x="804.00" y="720" class="value">7.0 m TEU</text>
  <text x="54" y="778" class="source">Sources: CAAV 2025 and Q1 2026 aviation market reports; Vietnam Maritime Administration 2024 maritime indicators; VNA/VnEconomy 2025 maritime growth report; Viet Nam Government Portal/Lloyd's List 2025 container-port ranking. Top-three Vietnamese container ports handled 23.2m TEU in 2024; inland waterway port cargo throughput was reported up 17% in 2025.</text>
</svg>
